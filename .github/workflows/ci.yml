name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=app
      - run: npm run typecheck --workspace=app
      - run: npm run build --workspace=app
      - run: node scripts/check-contrast.mjs
      - run: node scripts/check-motion.mjs

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the schema from migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database foos'
          psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f supabase/tests/local_shim.sql
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d foos -c 'alter table public.careers_rate_limit enable row level security'
          psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f supabase/tests/validate.sql
