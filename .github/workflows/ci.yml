name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=app
      - run: npm run typecheck --workspace=app
      - run: npm run typecheck --workspace=tests
      - run: npm run build --workspace=app
      - run: node scripts/check-contrast.mjs
      - run: node scripts/check-motion.mjs
      - run: node scripts/check-css-layers.mjs
      - run: node scripts/check-spacing-tokens.mjs
      - run: node scripts/check-icons.mjs
      - run: node scripts/check-unbounded-queries.mjs
      - run: node scripts/check-paged-order.mjs
      - run: node scripts/check-licences.mjs
      - run: npx knip --no-progress
      - run: node scripts/check-comments.mjs

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the schema from migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database foos'
          psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f supabase/tests/local_shim.sql
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Validate the rebuilt schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f supabase/tests/validate.sql
      - name: Validate again, to prove the script is re-runnable
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d foos -v ON_ERROR_STOP=1 -f supabase/tests/validate.sql

  integration:
    # The full stack: Supabase containers, 269 API/RLS tests and 276 browser
    # specs. Roughly 40 seconds for frontend and schema against 10 to 15 minutes
    # for this, so it runs where it decides something: the branch that deploys,
    # and any pull request into it. A develop push still gets lint, typecheck,
    # build and the plain-Postgres schema checks, which is what caught the
    # erasure_log and default-privilege defects on 2026-09-08.
    #
    # The browser step is sharded two ways because it is the whole cost: the run
    # on 2026-09-10 spent 17.6 of its 22 minutes there. Raising the worker count
    # is not an option, because ubuntu-latest on a private repo is 2 vCPU and
    # already about twice as slow per test as a developer machine at 2 workers,
    # so more Chromium workers contend rather than parallelise. Two shards run
    # 2 workers each on their own runner and their own Supabase stack. That
    # trades roughly 20 percent more billable minutes for close to half the wall
    # clock, and changes nothing about what is tested. Three shards would cut
    # more wall time for 40 percent more minutes; two is the better ratio.
    #
    # Vitest runs on shard 1 only. It is not sharded, so running it on both
    # would pay for it twice and make shard 2 the critical path for no gain.
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      FOOS_QA_TEST_PASSWORD: ci-only-test-password
      FOOS_INTAKE_PARSER_SECRET: ci-only-intake-secret
      FOOS_PW_SHARD_TOTAL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci

      - name: Provide Edge Function secrets
        run: |
          printf 'INTAKE_EMAIL_PARSER_SECRET=%s\nGOOGLE_SYNC_SECRET=ci-only-sync-secret\n' \
            "$FOOS_INTAKE_PARSER_SECRET" > supabase/functions/.env

      - name: Start the local Supabase stack
        run: supabase start

      - name: Capture the local keys
        id: keys
        run: |
          echo "anon=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Seed test personas
        run: node scripts/post-reset.mjs --personas-only

      - name: Write the test env
        run: |
          {
            echo "FOOS_SUPABASE_URL=http://127.0.0.1:55321"
            echo "FOOS_SUPABASE_ANON_KEY=${{ steps.keys.outputs.anon }}"
            echo "FOOS_QA_TEST_PASSWORD=$FOOS_QA_TEST_PASSWORD"
            echo "FOOS_INTAKE_PARSER_SECRET=$FOOS_INTAKE_PARSER_SECRET"
            echo "FOOS_BASE_URL=http://localhost:5175"
          } > tests/.env
          printf 'VITE_SUPABASE_URL=http://127.0.0.1:55321\nVITE_SUPABASE_ANON_KEY=%s\n' \
            "${{ steps.keys.outputs.anon }}" > app/.env.development.local

      - name: Check for migration drift
        run: node scripts/check-migrations.mjs

      - name: Validate the schema
        run: psql "postgresql://postgres:postgres@127.0.0.1:55322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/validate.sql

      - name: API and RLS tests
        if: matrix.shard == 1
        run: npm run test --workspace=tests

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser flow tests
        run: npm run e2e --workspace=tests -- --shard=${{ matrix.shard }}/${{ env.FOOS_PW_SHARD_TOTAL }}

      - name: No attachment files were orphaned by the suites
        run: node scripts/check-attachment-queue.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            tests/test-results/
            tests/playwright-report/
          retention-days: 7
