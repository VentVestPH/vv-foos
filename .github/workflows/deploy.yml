name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Require the database secret
        run: test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL is not set in the dev environment secrets"; exit 1; }
      - name: Pending migrations
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes


  functions:
    needs: database
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Require the access token
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not set in the dev environment secrets"; exit 1; }
      - name: Resolve the project ref
        run: |
          ref="$(printf '%s' "$SUPABASE_DB_URL" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+)[:@].*#\2#p')"
          test -n "$ref" || { echo "SUPABASE_DB_URL is not a pooler URI of the form postgres.<ref>"; exit 1; }
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
