name: Database

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Require the database secret
        run: test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL is not set in the dev environment secrets"; exit 1; }
      - name: Pending migrations
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

