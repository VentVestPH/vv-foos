name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Require the database secret
        run: test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL is not set in the repository secrets"; exit 1; }
      - name: Pending migrations
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

  frontend:
    needs: database
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'foos' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require the frontend secrets
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name}" || { echo "$name is not set in the repository secrets"; exit 1; }
          done
      - run: npm ci
      - run: npm run build --workspace=app
      - name: Confirm the bundle targets the configured project
        run: grep -q "$VITE_SUPABASE_URL" app/dist/assets/*.js
      - name: Publish to Cloudflare Pages
        run: npx wrangler pages deploy app/dist --project-name "$CF_PAGES_PROJECT" --branch develop --commit-hash "$GITHUB_SHA"
